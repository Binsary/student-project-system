{% extends 'projects/base.html' %}

{% block content %}
    <h2>Confirm Deletion</h2>
    <p>Are you sure you want to delete the project: <strong>{{ project.title }}</strong>?</p>
    
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'project_list' %}">Cancel</a>
    </form>
{% endblock %}
